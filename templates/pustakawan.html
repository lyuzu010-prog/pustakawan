<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Komando Pustakawan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 10px rgba(255,255,255,0.8); }
        }
        body { background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%); min-height: 100vh; }
    </style>
</head>
<body class="text-white font-sans relative">
    <div id="star-container" class="fixed inset-0 z-0 pointer-events-none"></div>

    <div class="relative z-10 container mx-auto p-6">
        <div class="flex justify-between items-center mb-8 bg-white/10 backdrop-blur-md p-4 rounded-xl border border-white/20">
            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">Komando Pustakawan</h1>
            <a href="/logout" class="px-4 py-2 bg-red-600/80 hover:bg-red-500 rounded-lg transition-colors border border-red-400">Logout</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Form Tambah Buku -->
            <div class="bg-white/10 backdrop-blur-md border border-cyan-500/30 p-6 rounded-xl h-fit">
                <h2 class="text-xl font-semibold mb-4 text-cyan-200">Wujud Buku Baru</h2>
                <form action="/tambah_buku" method="POST" class="space-y-4">
                    <input type="text" name="title" required placeholder="Judul Buku" class="w-full px-4 py-2 bg-black/50 border border-cyan-500/50 rounded-lg focus:outline-none focus:border-cyan-400 text-white">
                    <input type="text" name="author" required placeholder="Penulis" class="w-full px-4 py-2 bg-black/50 border border-cyan-500/50 rounded-lg focus:outline-none focus:border-cyan-400 text-white">
                    <input type="number" name="stock" required placeholder="Jumlah Stok" class="w-full px-4 py-2 bg-black/50 border border-cyan-500/50 rounded-lg focus:outline-none focus:border-cyan-400 text-white">
                    <button type="submit" class="w-full py-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg font-bold transition-all shadow-[0_0_15px_rgba(6,182,212,0.5)]">Tambahkan ke Galaksi</button>
                </form>
            </div>

            <!-- Tabel Katalog -->
            <div class="md:col-span-2 bg-white/10 backdrop-blur-md border border-blue-500/30 p-6 rounded-xl">
                <h2 class="text-xl font-semibold mb-4 text-blue-200">Katalog Kosmik</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-blue-500/50 text-blue-300">
                                <th class="p-3">ID</th>
                                <th class="p-3">Judul</th>
                                <th class="p-3">Penulis</th>
                                <th class="p-3">Stok</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for book in books %}
                            <tr class="border-b border-white/10 hover:bg-white/5 transition-colors">
                                <td class="p-3">#{{ book.id }}</td>
                                <td class="p-3 font-medium">{{ book.title }}</td>
                                <td class="p-3 text-gray-300">{{ book.author }}</td>
                                <td class="p-3 text-cyan-400 font-bold">{{ book.stock }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('star-container');
        for(let i=0; i<150; i++) {
            let star = document.createElement('div');
            star.className = 'absolute bg-white rounded-full';
            let size = Math.random() * 2.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animation = `twinkle ${Math.random() * 3 + 1}s infinite alternate`;
            container.appendChild(star);
        }
    </script>
</body>
</html>
